<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Psychic Broccoli</title>
        <link rel="stylesheet" href="/css/styles.css">
        <link rel="stylesheet" href="/turn-control/turnController.css">
        <link rel="stylesheet" href="/turn-control/custom.css">
        <link rel="icon" href="/assets/favicon.png" type="image/x-icon">
       
    </head>
    <body>
        <header>
            <nav>
                <img src="/assets/logo.png" alt="Logo do Psychic Broccoli" class="logo">
                <div class="nav-controls">
                    <button id="turnTrackerToggle" class="nav-turn-control" type="button" aria-pressed="false" aria-controls="turnControl">Controle de Turno</button>
                    <button class="nav-dice-roller" type="button">Rolador de Dados</button>
                </div>
                <div class="comm-controls">
                    <div class="nav-group-dotted">
                    <button id="navRoomCode" class="" type="button" title="Click to copy the shared room code"></button>
                    <button id="navRoomCreate" class="nav-room-code" type="button" title="Create a new shared room"><i class="bi bi-broadcast"></i></button>
                    </div>
                    <button id="commsToggleBtn" class="comms-toggle-btn" type="button" aria-expanded="false" aria-controls="commsSidebar">Config</button>
                </div>
            </nav>
        </header>

        <!-- fixed overlay for dice animation -->
        <div id="diceRollerContainer" class="dice-box"></div>

        <div class="app-layout">
            <main id="stage" class="stage">
                
                <div id="drawingBoardPanel" class="drawing-board-panel"></div>
                <section id="contentContainer">
                    <turn-controller></turn-controller>
                </section>
            </main>

            <aside class="comms-sidebar comms-sidebar--collapsed" id="commsSidebar">
                <div id="connectionPanel" class="connection-panel">
                    <div>
                        <label for="connectionCodeInput">Codigo da Sala</label>
                        <input id="connectionCodeInput" type="text" value="psychic-b" maxlength="24" placeholder="Type a shared room code">
                        <button id="copyConnectionCodeBtn" type="button" title="Refresh the room code" aria-label="Refresh the room code"><i class="bi bi-shuffle"></i></button>
                    </div>
                    <label for="identityLabelInput">Seu Nome</label>
                    <input id="identityLabelInput" type="text" value="Player 1" maxlength="32" placeholder="Nome mostrado aos outros jogadores">
                    <div class="connection-actions">
                        <button id="createConnectionBtn" type="button">Criar sala</button>
                        <button id="joinConnectionBtn" type="button">Entrar na sala</button>
                        <button id="sendTestMessageBtn" type="button">Enviar teste</button>
                    </div>
                    <p id="connectionStatus">Pronto para uma sala WebRTC compartilhada.</p>
                    <div class="peer-roster" aria-live="polite">
                        <strong>Participantes conectados</strong>
                        <ul id="peerList"></ul>
                    </div>
                </div>
                <div id="voiceChatPanel"></div>
                <div id="textChatPanel"></div>
            </aside>
        </div>

        <footer>
            <p><a href="https://brocolis.ninja">Brocolis.Ninja</a></p>
            <p><a href="https://github.com/brocolis-ninja/boardgame-app">GitHub Repository</a></p>
            <p><a href="https://brocolis.ninja/boardgame-app/issues">Report an Issue</a></p>
            <p>Use com moderação - Respeite as Leis locais</p>
        </footer>
    </body>
    <script type="module" src="/js/script.js?v=3"></script>
</html>
