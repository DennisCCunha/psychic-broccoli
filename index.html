<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Psychic Broccoli</title>
        
        <link rel="stylesheet" href="/css/styles.css">
        <link rel="icon" href="/assets/favicon.png" type="image/x-icon">
    </head>
    <body>
        <header>
            <nav>
                <img src="/assets/logo.png" alt="Logo do Psychic Broccoli" class="logo">
                <div id="gameActions"class="nav-actions">
                    <button id="gameActionBtn" class="game-action-btn" type="button">Game Action</button>
                    <button id="gameActionBtn2" class="game-action-btn" type="button">Another Action</button>
                    <button id="gameActionBtn3" class="game-action-btn" type="button">Yet Another Action</button>
                </div>
                <div id="commsActions" class="nav-actions">
                    <button id="commsConnectBtn" class="comms-toggle-btn" type="button" title="Click to connect to the room"><i class="connect-icon"></i>Criar Sala</button>
                    <button id="navRoomCode" class="nav-room-code" type="button" title="Click to copy the shared room code"></button>
                    <button id="navRoomShare" class="nav-room-code" type="button" title="Click to share the room code"><i class="share-icon"></i></button>
                    <button id="commsToggleBtn" class="comms-toggle-btn" type="button" aria-expanded="false" aria-controls="commsSidebar"><i class="config-icon"></i>Config</button>
                </div>
            </nav>
        </header>

        <!-- fixed overlay for dice animation -->
        <div id="diceRollerContainer" class="dice-box"></div>

        <div class="app-layout">
            <main id="stage" class="stage">
                
                <div id="drawingBoardPanel" class="drawing-board-panel"></div>
                <section id="contentContainer"></section>
            </main>

            <aside class="comms-sidebar comms-sidebar--collapsed" id="commsSidebar">
                <div id="connectionPanel" class="connection-panel">
                    <label for="connectionCodeInput">Shared code</label>
                    <input id="connectionCodeInput" type="text" value="psychic-b" maxlength="24" placeholder="Type a shared room code">
                    <label for="identityLabelInput">Your identity</label>
                    <input id="identityLabelInput" type="text" value="Player 1" maxlength="32" placeholder="Name shown to peers">
                    <div class="connection-actions">
                        <button id="createConnectionBtn" type="button">Create room</button>
                        <button id="joinConnectionBtn" type="button">Join room</button>
                        <button id="sendTestMessageBtn" type="button">Send test</button>
                    </div>
                    <p id="connectionStatus">Ready for a shared WebRTC room.</p>
                    <div class="peer-roster" aria-live="polite">
                        <strong>Connected peers</strong>
                        <ul id="peerList"></ul>
                    </div>
                </div>
                <div id="voiceChatPanel"></div>
                <div id="textChatPanel"></div>
            </aside>
        </div>

        <footer>
            <p><a href="https://brocolis.ninja">Brocolis.Ninja</a></p>
        </footer>
    </body>
    <script type="module" src="/js/script.js?v=2"></script>
</html>
