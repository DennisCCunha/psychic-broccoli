<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Psychic Broccoli</title>
        <link rel="stylesheet" href="/css/styles.css">
        <link rel="icon" href="/assets/favicon.png" type="image/x-icon">
    </head>
    <body>
        
        <header>
            <nav>
                <img src="/assets/logo.png" alt="Logo do Psychic Broccoli" class="logo">
                <ul>
                    <li><a href="#">Controle de Turno</a></li>
                    <li><a href="#">Rolador de Dados</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
        </header>
        <div id="diceRollerContainer" class="dice-box">
        </div>

        <div id="connectionPanel" class="connection-panel">
            <label for="connectionCodeInput">Shared code</label>
            <input id="connectionCodeInput" type="text" value="psychic-b" maxlength="24" placeholder="Type a shared room code">
            <div class="connection-actions">
                <button id="createConnectionBtn" type="button">Create room</button>
                <button id="joinConnectionBtn" type="button">Join room</button>
                <button id="sendTestMessageBtn" type="button">Send test</button>
            </div>
            <p id="connectionStatus">Ready for a shared WebRTC room.</p>
        </div>

        <section id="contentContainer">
            
        </section>
        
        <footer>
            <p>&copy; 2024 Psychic Broccoli. Todos os direitos reservados.</p>
        </footer>
    </body>
    <script type="module" src="/js/script.js"></script>
</html>
